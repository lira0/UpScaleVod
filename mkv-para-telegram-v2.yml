name: MKV para MP4 e Telegram - API local

on:
  workflow_dispatch:
    inputs:
      video_links:
        description: 'URL | Nome ;; URL | Nome. Se vazio, usa VIDEO_LINKS secret.'
        required: false
        type: string

permissions: {}

concurrency:
  group: mkv-telegram-uploader
  cancel-in-progress: false

jobs:
  converter-e-enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Instalar aria2 FFmpeg e bibliotecas Python
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 ffmpeg
          python -m pip install --disable-pip-version-check --no-cache-dir requests==2.32.5 requests-toolbelt==1.0.0

      - name: Iniciar servidor local Telegram Bot API - 2 GB
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_API_ID" || { echo '::error::Falta TELEGRAM_API_ID'; exit 1; }
          test -n "$TELEGRAM_API_HASH" || { echo '::error::Falta TELEGRAM_API_HASH'; exit 1; }
          test -n "$TELEGRAM_BOT_TOKEN" || { echo '::error::Falta TELEGRAM_BOT_TOKEN'; exit 1; }
          # A conta deste bot deve ser exclusiva para uploads, não o bot leitor do CloudGram.
          # Em cada execução, transfere o bot da API na nuvem para a API local.
          python - <<'PY'
          import os, requests
          token = os.environ['TELEGRAM_BOT_TOKEN']
          url = f'https://api.telegram.org/bot{token}/logOut'
          try:
              result = requests.post(url, timeout=30)
              data = result.json()
              if data.get('ok'):
                  print('Bot desconectado da API hospedada. Usando servidor local.')
              else:
                  # Pode já estar desligado da nuvem após execução anterior.
                  print('Aviso na troca de servidor:', data.get('description', 'resposta desconhecida'))
          except requests.RequestException as e:
              raise RuntimeError('Falha de rede ao fazer logOut da API hospedada') from e
          PY
          # Imagem comunitária da aiogram (código e Dockerfile públicos).
          # A porta fica acessível apenas a partir do runner.
          docker run -d --name tg-api --init \
            -p 127.0.0.1:8081:8081 \
            -e TELEGRAM_LOCAL=1 \
            -e TELEGRAM_API_ID="$TELEGRAM_API_ID" \
            -e TELEGRAM_API_HASH="$TELEGRAM_API_HASH" \
            aiogram/telegram-bot-api:latest >/dev/null
          for i in $(seq 1 40); do
            if curl --max-time 2 --silent http://127.0.0.1:8081/ >/dev/null; then
              echo 'Servidor HTTP local iniciado.'
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' tg-api | grep -qx true; then
              echo '::error::Servidor local encerrou inesperadamente.'
              docker logs --tail 80 tg-api
              exit 1
            fi
            sleep 3
          done

      - name: Validar grupo, converter e enviar fila
        shell: bash
        env:
          VIDEO_LINKS_INPUT: ${{ inputs.video_links }}
          VIDEO_LINKS_SECRET: ${{ secrets.VIDEO_LINKS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          """Fila MKV -> MP4 sem recodificar -> servidor Bot API local até 2 GB."""
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile
          import time
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          import requests
          from requests_toolbelt.multipart.encoder import MultipartEncoder, MultipartEncoderMonitor

          MAX_FILE_BYTES = 1_950_000_000
          MAX_QUEUE_SECONDS = 5 * 3600 + 10 * 60
          BASE = 'http://127.0.0.1:8081'
          TOKEN = os.getenv('TELEGRAM_BOT_TOKEN', '')
          CHAT = os.getenv('TELEGRAM_CHAT_ID', '').strip()
          SESSION = requests.Session()

          def api(method, *, data=None, timeout=(10, 120)):
              resp = SESSION.post(f'{BASE}/bot{TOKEN}/{method}', data=data, timeout=timeout)
              try:
                  payload = resp.json()
              except ValueError:
                  raise RuntimeError(f'{method}: servidor respondeu HTTP {resp.status_code} (sem JSON)')
              if not payload.get('ok'):
                  raise RuntimeError(f'{method}: {payload.get("description", "erro desconhecido")}')
              return payload['result']

          def safe_title(value):
              value = re.sub(r'[\x00-\x1f<>:"/\\|?*]+', '_', value).strip(' .')
              if value.lower().endswith(('.mkv', '.mp4', '.avi', '.mov', '.ts', '.webm')):
                  value = value.rsplit('.', 1)[0]
              return (value.strip(' .') or 'Episodio')[:140]

          def read_queue():
              raw = (os.getenv('VIDEO_LINKS_INPUT') or os.getenv('VIDEO_LINKS_SECRET') or '').strip()
              if not raw:
                  raise ValueError('Sem links: informe em Run workflow ou no secret VIDEO_LINKS.')
              raw = re.sub(r'\s*;;\s*', '\n', raw)
              items = []
              for line in raw.splitlines():
                  line = line.strip()
                  if not line or line.startswith('#'):
                      continue
                  url, sep, title = line.partition(' | ')
                  url = url.strip()
                  parsed = urlsplit(url)
                  if parsed.scheme not in ('http','https') or not parsed.netloc:
                      raise ValueError('URL inválida. Informe um link direto http(s).')
                  default = Path(unquote(parsed.path).rsplit('/', 1)[-1]).stem or f'Episodio_{len(items) + 1:02d}'
                  items.append((url, safe_title(title if sep and title.strip() else default)))
              if not items:
                  raise ValueError('Fila vazia.')
              return items

          def execute(command, name):
              result = subprocess.run(command, text=True, stdout=subprocess.DEVNULL,
                                      stderr=subprocess.PIPE, check=False)
              if result.returncode:
                  raise RuntimeError(f'{name} falhou (código {result.returncode}): {result.stderr[-900:]}')

          def download(url, folder):
              execute(['aria2c', '--no-conf=true', '--file-allocation=none',
                       '--max-connection-per-server=4', '--split=4', '--min-split-size=10M',
                       '--max-tries=5', '--retry-wait=10', '--connect-timeout=30', '--timeout=90',
                       '--summary-interval=0', '--console-log-level=warn',
                       f'--dir={folder}', '--out=origem.mkv', '--', url], 'Download')
              file = folder / 'origem.mkv'
              if not file.is_file() or not file.stat().st_size:
                  raise RuntimeError('Download vazio ou inexistente.')
              return file

          def remux(src, dst):
              execute(['ffmpeg', '-hide_banner', '-loglevel', 'error', '-nostdin', '-y',
                       '-i', str(src), '-map', '0:v:0', '-map', '0:a?',
                       '-c', 'copy', '-movflags', '+faststart', str(dst)], 'FFmpeg')
              if not dst.is_file() or not dst.stat().st_size:
                  raise RuntimeError('MP4 inexistente ou vazio.')
              if dst.stat().st_size > MAX_FILE_BYTES:
                  raise RuntimeError(f'Arquivo excede 1,95 GB ({dst.stat().st_size} bytes).')
              probe = subprocess.run(['ffprobe', '-v', 'error', '-show_entries',
                                      'stream=codec_name,codec_type', '-of', 'json', str(dst)],
                                     capture_output=True, text=True, check=True)
              streams = json.loads(probe.stdout)['streams']
              codecs = ', '.join(f'{s["codec_type"]}:{s["codec_name"]}' for s in streams)
              print(f'MP4 pronto: {dst.stat().st_size / 1e6:.1f} MB | {codecs}', flush=True)

          def send_video(file, title):
              last = [-10, 0.0]
              def progress(monitor):
                  now = time.monotonic()
                  pct = int(100 * monitor.bytes_read / monitor.len) if monitor.len else 0
                  if pct >= last[0] + 10 or now - last[1] > 120:
                      print(f'Envio local: {pct}% da requisição', flush=True)
                      last[:] = [pct, now]
              with file.open('rb') as stream:
                  encoder = MultipartEncoder(fields={
                      'chat_id': CHAT,
                      'caption': title,
                      'supports_streaming': 'true',
                      'video': (file.name, stream, 'video/mp4'),
                  })
                  monitor = MultipartEncoderMonitor(encoder, progress)
                  response = SESSION.post(f'{BASE}/bot{TOKEN}/sendVideo', data=monitor,
                                          headers={'Content-Type': monitor.content_type},
                                          timeout=(30, 3600))
              try:
                  payload = response.json()
              except ValueError:
                  raise RuntimeError(f'sendVideo: erro HTTP {response.status_code}')
              if not payload.get('ok'):
                  raise RuntimeError('sendVideo: ' + payload.get('description', 'erro sem descrição'))
              msg = payload['result']
              return msg['message_id']

          def main():
              if not TOKEN or not CHAT:
                  raise RuntimeError('Configure TELEGRAM_BOT_TOKEN e TELEGRAM_CHAT_ID.')
              queue = read_queue()
              for url, _ in queue:
                  print('::add-mask::' + url, flush=True)
              print('Verificando identificação do bot e do grupo...', flush=True)
              bot = api('getMe')
              print('Bot de upload: @' + bot.get('username', '(sem username)'), flush=True)
              if CHAT.lstrip('-').isdigit() and not CHAT.startswith('-'):
                  raise ValueError('ID de grupo deve ser negativo; em supergrupos normalmente começa com -100.')
              group = api('getChat', data={'chat_id': CHAT})
              print('Grupo encontrado:', group.get('title') or group.get('username') or group.get('id'),
                    '| ID:', group['id'], flush=True)
              # Sem mensagem de teste: getChat valida presença, antes de baixar o primeiro vídeo.
              started = time.monotonic()
              records = []
              for idx, (url, title) in enumerate(queue, 1):
                  if time.monotonic() - started > MAX_QUEUE_SECONDS:
                      print('Limite de tempo próximo: fila interrompida.', flush=True)
                      records.extend((n, False) for _, n in queue[idx-1:])
                      break
                  print(f'[{idx}/{len(queue)}] {title}', flush=True)
                  try:
                      with tempfile.TemporaryDirectory(prefix='mkv-mp4-', dir=os.getenv('RUNNER_TEMP')) as folder:
                          folder = Path(folder)
                          mkv = download(url, folder)
                          mp4 = folder / f'{title}.mp4'
                          remux(mkv, mp4)
                          message_id = send_video(mp4, title)
                          print(f'Enviado! message_id={message_id}', flush=True)
                          records.append((title, True))
                  except Exception as ex:
                      message = str(ex).replace(url, '[URL OCULTA]')
                      print(f'Falha: {message}', flush=True)
                      records.append((title, False))
              total = sum(ok for _, ok in records)
              print(f'Concluído: {total}/{len(queue)} vídeo(s).', flush=True)
              summary_path = os.getenv('GITHUB_STEP_SUMMARY')
              if summary_path:
                  with open(summary_path, 'a', encoding='utf-8') as f:
                      f.write('## MKV → MP4 → Telegram (API local)\n\n')
                      f.write('| Episódio | Status |\n|---|---|\n')
                      for name, ok in records:
                          f.write(f'| {name.replace("|", "/")} | {"✅ Enviado" if ok else "❌ Falhou"} |\n')
              return 0 if total == len(queue) else 1

          if __name__ == '__main__':
              try:
                  sys.exit(main())
              except Exception as ex:
                  print('ERRO FATAL:', ex, file=sys.stderr)
                  sys.exit(1)
          PY

      - name: Finalizar servidor temporário
        if: always()
        run: docker rm -f tg-api 2>/dev/null || true
