name: Upscale 1080p -> Telegram

on:
  workflow_dispatch:
    inputs:
      queue:
        description: "Um por linha: URL | Nome do episodio"
        required: true
        type: string
      crf:
        description: "Qualidade HEVC (menor = melhor/maior arquivo)"
        required: false
        default: "18"
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.queue.outputs.matrix }}
    steps:
      - name: Montar fila
        id: queue
        shell: python
        env:
          QUEUE: ${{ inputs.queue }}
        run: |
          import json, os
          items=[]
          for i,line in enumerate(os.environ['QUEUE'].splitlines(),1):
              line=line.strip()
              if not line: continue
              if '|' in line:
                  url,name=line.split('|',1)
                  url=url.strip(); name=name.strip()
              else:
                  url=line; name=f"Video_{i:02d}"
              if not (url.startswith('http://') or url.startswith('https://')):
                  raise SystemExit(f"URL invalida na linha {i}")
              items.append({'url':url,'name':name})
          if not items:
              raise SystemExit('Fila vazia')
          print(f"matrix={json.dumps({'include':items}, separators=(',',':'))}", file=open(os.environ['GITHUB_OUTPUT'],'a'))

  upscale:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Liberar espaco do runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: Instalar FFmpeg e aria2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg aria2 curl ca-certificates

      - name: Preparar nomes
        id: vars
        shell: bash
        env:
          RAW_NAME: ${{ matrix.name }}
        run: |
          SAFE_NAME=$(printf '%s' "$RAW_NAME" | sed 's#[/\\:*?"<>|]#_#g' | sed 's/[[:space:]]*$//')
          [ -n "$SAFE_NAME" ] || SAFE_NAME="video"
          echo "safe_name=$SAFE_NAME" >> "$GITHUB_OUTPUT"

      - name: Baixar video
        env:
          VIDEO_URL: ${{ matrix.url }}
        run: |
          mkdir -p work
          aria2c \
            --continue=true \
            --max-connection-per-server=8 \
            --split=8 \
            --min-split-size=4M \
            --file-allocation=none \
            --dir=work \
            --out=input.video \
            "$VIDEO_URL"
          ls -lh work/input.video
          df -h /

      - name: Analisar fonte
        run: |
          ffprobe -v error \
            -show_entries format=duration,size:stream=index,codec_type,codec_name,width,height \
            -of default=noprint_wrappers=1 work/input.video

      - name: Upscale/restauracao para 1080p HEVC 10-bit
        env:
          OUT_NAME: ${{ steps.vars.outputs.safe_name }}
          CRF: ${{ inputs.crf }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="work/${OUT_NAME}.mkv"

          # CPU-friendly: limpeza leve + upscale Lanczos + sharpening conservador.
          # Mantem proporcao e evita ampliar acima de 1080p se a fonte ja for maior.
          VF="hqdn3d=1.2:1.2:6:6,scale='if(gt(iw,1920),iw,1920)':'if(gt(ih,1080),ih,1080)':force_original_aspect_ratio=decrease:flags=lanczos,setsar=1,unsharp=5:5:0.35:5:5:0.0"

          ffmpeg -hide_banner -y -i work/input.video \
            -map 0:v:0 -map 0:a? -map 0:s? \
            -vf "$VF" \
            -c:v libx265 -preset medium -crf "$CRF" -pix_fmt yuv420p10le \
            -x265-params "aq-mode=3:rc-lookahead=40" \
            -c:a aac -b:a 192k \
            -c:s copy \
            -map_metadata 0 \
            "$OUT"

          ls -lh "$OUT"

      - name: Garantir arquivo abaixo de 1.90 GB
        env:
          OUT_NAME: ${{ steps.vars.outputs.safe_name }}
        shell: bash
        run: |
          set -euo pipefail
          FILE="work/${OUT_NAME}.mkv"
          # Alvo decimal de 1.90 GB para deixar margem abaixo de 2.0 GB.
          LIMIT=1900000000
          SIZE=$(stat -c%s "$FILE")

          if [ "$SIZE" -le "$LIMIT" ]; then
            echo "Arquivo dentro do limite: $SIZE bytes"
            exit 0
          fi

          echo "Arquivo acima de 1.90 GB. Reencode de seguranca por bitrate..."
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$FILE")
          # Reserva ~192 kb/s para audio e 3% para overhead/container.
          VIDEO_KBPS=$(python3 - <<PY
          duration=float("$DURATION")
          target_bytes=1_850_000_000
          total_kbps=(target_bytes*8/duration)/1000
          print(max(500, int((total_kbps-192)*0.97)))
          PY
          )
          echo "Bitrate de video de seguranca: ${VIDEO_KBPS}k"

          ffmpeg -hide_banner -y -i "$FILE" \
            -map 0:v:0 -map 0:a? -map 0:s? \
            -c:v libx265 -preset medium -b:v "${VIDEO_KBPS}k" \
            -maxrate "${VIDEO_KBPS}k" -bufsize "$((VIDEO_KBPS*2))k" \
            -pix_fmt yuv420p10le \
            -c:a aac -b:a 192k -c:s copy \
            "work/final.mkv"
          mv work/final.mkv "$FILE"

          FINAL_SIZE=$(stat -c%s "$FILE")
          echo "Tamanho final: $FINAL_SIZE bytes"
          if [ "$FINAL_SIZE" -gt 1950000000 ]; then
            echo "ERRO: arquivo ainda excede margem segura para Telegram."
            exit 1
          fi

      - name: Enviar para Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OUT_NAME: ${{ steps.vars.outputs.safe_name }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${TELEGRAM_BOT_TOKEN:-}" ] || { echo "Secret TELEGRAM_BOT_TOKEN ausente"; exit 1; }
          [ -n "${TELEGRAM_CHAT_ID:-}" ] || { echo "Secret TELEGRAM_CHAT_ID ausente"; exit 1; }

          FILE="work/${OUT_NAME}.mkv"
          curl --fail-with-body --retry 4 --retry-delay 10 \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "supports_streaming=true" \
            -F "caption=${OUT_NAME}" \
            -F "document=@${FILE};type=video/x-matroska" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"

      - name: Limpeza
        if: always()
        run: |
          rm -rf work || true
          df -h /
