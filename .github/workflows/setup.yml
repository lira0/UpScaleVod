name: Preparar Video Upscaler

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Localizar arquivo ZIP
        id: zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: nenhum arquivo .zip encontrado na raiz do repositório."
            exit 1
          fi

          echo "Arquivo encontrado: $ZIP_FILE"
          echo "file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Instalar ferramentas
