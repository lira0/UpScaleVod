name: Preparar Video Upscaler

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Localizar arquivo ZIP
        id: zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: nenhum arquivo .zip encontrado na raiz do repositório."
            exit 1
          fi

          echo "Arquivo encontrado: $ZIP_FILE"
          echo "file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Instalar ferramentas necessárias
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Criar pasta temporária
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted

      - name: Descompactar projeto
        shell: bash
        run: |
          ZIP_FILE="${{ steps.zip.outputs.file }}"

          echo "Descompactando:"
          echo "$ZIP_FILE"

          unzip -o "$ZIP_FILE" -d extracted

          echo ""
          echo "======================================"
          echo "ARQUIVOS EXTRAÍDOS"
          echo "======================================"

          find extracted -maxdepth 5 -print

      - name: Detectar estrutura do ZIP
        shell: bash
        run: |
          shopt -s dotglob nullglob

          ITEMS=(extracted/*)

          echo "Quantidade de itens na raiz do ZIP: ${#ITEMS[@]}"

          # Se o ZIP tiver apenas uma pasta principal,
          # copia o conteúdo interno dessa pasta.
          if [ "${#ITEMS[@]}" -eq 1 ] && [ -d "${ITEMS[0]}" ]; then

            echo "Detectada uma pasta principal:"
            echo "${ITEMS[0]}"

            cp -a "${ITEMS[0]}/." .

          else

            echo "O ZIP já contém os arquivos na estrutura principal."

            cp -a extracted/. .

          fi

      - name: Dar permissão aos scripts
        shell: bash
        run: |
          if [ -d "scripts" ]; then
            find scripts -type f -name "*.sh" -exec chmod +x {} \;
          fi

      - name: Remover arquivos temporários
        shell: bash
        run: |
          rm -rf extracted

          ZIP_FILE="${{ steps.zip.outputs.file }}"

          if [ -f "$ZIP_FILE" ]; then
            rm -f "$ZIP_FILE"
          fi

      - name: Mostrar estrutura final
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "ESTRUTURA FINAL DO REPOSITÓRIO"
          echo "======================================"

          find . \
            -not -path "./.git/*" \
            -maxdepth 5 \
            -print

      - name: Configurar Git
        shell: bash
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Git configurado:"
          git config --local user.name
          git config --local user.email

      - name: Criar commit
        shell: bash
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "Nenhuma alteração encontrada."
            exit 0
          fi

          git status

          git commit -m "Instalar Video Upscaler"

      - name: Enviar alterações para o GitHub
        shell: bash
        run: |
          git push origin HEAD:${{ github.ref_name }}

      - name: Finalizado
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "VIDEO UPSCALER INSTALADO COM SUCESSO"
          echo "======================================"
          echo ""
          echo "Agora abra a aba Actions."
          echo "O workflow do Video Upscaler deverá aparecer."
