name: Video Upscaler - aria2

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Link direto do episódio"
        required: true
        type: string

      output_name:
        description: "Nome do arquivo final"
        required: true
        default: "episodio_FHD"
        type: string

      resolution:
        description: "Resolução final"
        required: true
        default: "1080p"
        type: choice
        options:
          - 1080p
          - 720p

      profile:
        description: "Perfil de processamento"
        required: true
        default: "quality"
        type: choice
        options:
          - fast
          - quality

      codec:
        description: "Codec do vídeo final"
        required: true
        default: "h265"
        type: choice
        options:
          - h265
          - h264

      crf:
        description: "Qualidade - menor = melhor"
        required: true
        default: "19"
        type: choice
        options:
          - "18"
          - "19"
          - "20"
          - "21"
          - "22"

permissions:
  contents: read

jobs:
  upscale:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # =========================================================
      # INSTALAR DEPENDÊNCIAS
      # =========================================================

      - name: Instalar FFmpeg e aria2
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            aria2

          echo ""
          echo "========================================="
          echo "FFMPEG"
          echo "========================================="

          ffmpeg -version | head -n 5

          echo ""
          echo "========================================="
          echo "ARIA2"
          echo "========================================="

          aria2c --version | head -n 5

      # =========================================================
      # PREPARAR AMBIENTE
      # =========================================================

      - name: Preparar ambiente
        shell: bash
        run: |
          mkdir -p work
          mkdir -p output

          echo ""
          echo "========================================="
          echo "ESPAÇO DISPONÍVEL"
          echo "========================================="

          df -h .

      # =========================================================
      # DOWNLOAD COM ARIA2
      # =========================================================

      - name: Baixar episódio com aria2
        shell: bash
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          set -e

          echo ""
          echo "========================================="
          echo "BAIXANDO EPISÓDIO COM ARIA2"
          echo "========================================="

          aria2c \
            --continue=true \
            --max-tries=20 \
            --retry-wait=5 \
            --timeout=30 \
            --connect-timeout=30 \
            --lowest-speed-limit=10K \
            --file-allocation=none \
            --auto-file-renaming=false \
            --allow-overwrite=true \
            --check-certificate=true \
            --max-connection-per-server=4 \
            --split=4 \
            --min-split-size=5M \
            --user-agent="Mozilla/5.0" \
            --dir=work \
            --out=input_video \
            "$VIDEO_URL"

          echo ""
          echo "========================================="
          echo "DOWNLOAD CONCLUÍDO"
          echo "========================================="

          ls -lh work/input_video

      # =========================================================
      # VALIDAR DOWNLOAD
      # =========================================================

      - name: Validar vídeo baixado
        shell: bash
        run: |
          echo ""
          echo "========================================="
          echo "VALIDANDO ARQUIVO"
          echo "========================================="

          if [ ! -s work/input_video ]; then
            echo "ERRO: arquivo vazio ou inexistente."
            exit 1
          fi

          ffprobe \
            -v error \
            -show_entries format=duration,size,format_name \
            -show_entries stream=index,codec_name,width,height,r_frame_rate \
            work/input_video

          echo ""
          echo "Arquivo reconhecido como vídeo."

      # =========================================================
      # MOSTRAR INFORMAÇÕES DO ORIGINAL
      # =========================================================

      - name: Informações do vídeo original
        shell: bash
        run: |
          echo ""
          echo "========================================="
          echo "VÍDEO ORIGINAL"
          echo "========================================="

          ffprobe \
            -hide_banner \
            work/input_video \
            2>&1 || true

      # =========================================================
      # PROCESSAMENTO
      # =========================================================

      - name: Melhorar qualidade do vídeo
        id: process
        shell: bash
        env:
          RESOLUTION: ${{ inputs.resolution }}
          PROFILE: ${{ inputs.profile }}
          CODEC: ${{ inputs.codec }}
          CRF: ${{ inputs.crf }}
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          set -euo pipefail

          echo ""
          echo "========================================="
          echo "CONFIGURAÇÕES"
          echo "========================================="

          echo "Resolução: $RESOLUTION"
          echo "Perfil:    $PROFILE"
          echo "Codec:     $CODEC"
          echo "CRF:       $CRF"

          SAFE_NAME=$(printf '%s' "$OUTPUT_NAME" \
            | sed 's#[/\\]#_#g' \
            | tr -d '\r\n')

          if [ -z "$SAFE_NAME" ]; then
            SAFE_NAME="episodio_FHD"
          fi

          OUTPUT_FILE="output/${SAFE_NAME}.mkv"

          # =====================================================
          # RESOLUÇÃO
          # =====================================================

          case "$RESOLUTION" in

            1080p)
              WIDTH=1920
              HEIGHT=1080
              ;;

            720p)
              WIDTH=1280
              HEIGHT=720
              ;;

            *)
              echo "Resolução inválida."
              exit 1
              ;;

          esac

          # =====================================================
          # SCALE
          # =====================================================

          SCALE_FILTER="scale=${WIDTH}:${HEIGHT}:force_original_aspect_ratio=decrease:flags=lanczos+accurate_rnd+full_chroma_int,pad=${WIDTH}:${HEIGHT}:(ow-iw)/2:(oh-ih)/2:black"

          # =====================================================
          # PERFIL
          # =====================================================

          case "$PROFILE" in

            fast)

              echo "Perfil FAST"

              VF="hqdn3d=1.0:1.0:4.0:4.0,${SCALE_FILTER},unsharp=5:5:0.25:5:5:0.0"

              PRESET_H264="veryfast"
              PRESET_H265="veryfast"
              ;;

            quality)

              echo "Perfil QUALITY"

              VF="hqdn3d=1.5:1.5:6.0:6.0,deband=1thr=0.018:2thr=0.018:3thr=0.018:4thr=0.018:range=16:blur=true,${SCALE_FILTER},unsharp=5:5:0.40:5:5:0.0"

              PRESET_H264="fast"
              PRESET_H265="fast"
              ;;

            *)

              echo "Perfil inválido."
              exit 1
              ;;

          esac

          # =====================================================
          # CODEC
          # =====================================================

          case "$CODEC" in

            h265)
              VIDEO_CODEC="libx265"
              PRESET="$PRESET_H265"
              ;;

            h264)
              VIDEO_CODEC="libx264"
              PRESET="$PRESET_H264"
              ;;

            *)
              echo "Codec inválido."
              exit 1
              ;;

          esac

          # =====================================================
          # PROCESSAMENTO
          # =====================================================

          echo ""
          echo "========================================="
          echo "INICIANDO UPSCALE"
          echo "========================================="

          echo "Entrada:"
          ls -lh work/input_video

          echo ""
          echo "Saída:"
          echo "$OUTPUT_FILE"

          echo ""
          echo "Filtro:"
          echo "$VF"

          ffmpeg \
            -hide_banner \
            -y \
            -i work/input_video \
            -map 0:v:0 \
            -map 0:a? \
            -map 0:s? \
            -map_metadata 0 \
            -vf "$VF" \
            -c:v "$VIDEO_CODEC" \
            -preset "$PRESET" \
            -crf "$CRF" \
            -pix_fmt yuv420p \
            -c:a copy \
            -c:s copy \
            "$OUTPUT_FILE"

          echo ""
          echo "========================================="
          echo "UPSCALE CONCLUÍDO"
          echo "========================================="

          ls -lh "$OUTPUT_FILE"

          echo "output_file=$OUTPUT_FILE" >> "$GITHUB_OUTPUT"

      # =========================================================
      # VALIDAR RESULTADO
      # =========================================================

      - name: Verificar vídeo final
        shell: bash
        run: |
          echo ""
          echo "========================================="
          echo "RESULTADO FINAL"
          echo "========================================="

          ls -lh output/

          echo ""
          echo "========================================="
          echo "FFPROBE"
          echo "========================================="

          ffprobe \
            -hide_banner \
            output/*.mkv \
            2>&1 || true

          echo ""
          echo "========================================="
          echo "ESPAÇO RESTANTE"
          echo "========================================="

          df -h .

      # =========================================================
      # PUBLICAR ARTIFACT
      # =========================================================

      - name: Publicar episódio melhorado
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}
          path: output/*.mkv
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
