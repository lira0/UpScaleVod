name: Video Upscaler - CPU

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Link direto do episódio"
        required: true
        type: string

      output_name:
        description: "Nome do arquivo final"
        required: true
        default: "episodio_FHD"
        type: string

      resolution:
        description: "Resolução final"
        required: true
        default: "1080p"
        type: choice
        options:
          - 1080p
          - 720p

      profile:
        description: "Qualidade do processamento"
        required: true
        default: "quality"
        type: choice
        options:
          - fast
          - quality

      codec:
        description: "Codec"
        required: true
        default: "h265"
        type: choice
        options:
          - h265
          - h264

      crf:
        description: "Qualidade do encoder - menor = melhor"
        required: true
        default: "19"
        type: choice
        options:
          - "18"
          - "19"
          - "20"
          - "21"
          - "22"

permissions:
  contents: read

jobs:
  upscale:
    runs-on: ubuntu-latest

    # Runner do GitHub tem limite máximo.
    # Deixamos uma margem abaixo de 6 horas.
    timeout-minutes: 350

    steps:

      # =========================================================
      # INSTALAR FERRAMENTAS
      # =========================================================

      - name: Instalar FFmpeg
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

          echo ""
          echo "========================================="
          echo "VERSÃO DO FFMPEG"
          echo "========================================="

          ffmpeg -version | head -n 5

      # =========================================================
      # PREPARAR PASTAS
      # =========================================================

      - name: Preparar ambiente
        shell: bash
        run: |
          mkdir -p work
          mkdir -p output

          echo "Espaço disponível:"
          df -h .

      # =========================================================
      # DOWNLOAD DO EPISÓDIO
      # =========================================================

      - name: Baixar episódio
        shell: bash
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          echo "========================================="
          echo "BAIXANDO EPISÓDIO"
          echo "========================================="

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            -A "Mozilla/5.0" \
            "$VIDEO_URL" \
            -o work/input_video

          echo ""
          echo "Download concluído."

          ls -lh work/input_video

      # =========================================================
      # ANALISAR VÍDEO ORIGINAL
      # =========================================================

      - name: Analisar vídeo original
        shell: bash
        run: |
          echo ""
          echo "========================================="
          echo "INFORMAÇÕES DO VÍDEO ORIGINAL"
          echo "========================================="

          ffprobe \
            -hide_banner \
            -show_format \
            -show_streams \
            work/input_video \
            || true

      # =========================================================
      # PROCESSAMENTO
      # =========================================================

      - name: Melhorar vídeo
        id: process
        shell: bash
        env:
          RESOLUTION: ${{ inputs.resolution }}
          PROFILE: ${{ inputs.profile }}
          CODEC: ${{ inputs.codec }}
          CRF: ${{ inputs.crf }}
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          set -euo pipefail

          echo ""
          echo "========================================="
          echo "CONFIGURAÇÃO"
          echo "========================================="

          echo "Resolução: $RESOLUTION"
          echo "Perfil:    $PROFILE"
          echo "Codec:     $CODEC"
          echo "CRF:       $CRF"

          # -----------------------------------------------------
          # Nome seguro para o arquivo
          # -----------------------------------------------------

          SAFE_NAME=$(printf '%s' "$OUTPUT_NAME" \
            | sed 's#[/\\]#_#g' \
            | tr -d '\r\n')

          if [ -z "$SAFE_NAME" ]; then
            SAFE_NAME="episodio_FHD"
          fi

          OUTPUT_FILE="output/${SAFE_NAME}.mkv"

          echo "Arquivo:   $OUTPUT_FILE"

          # -----------------------------------------------------
          # RESOLUÇÃO
          # -----------------------------------------------------

          case "$RESOLUTION" in

            1080p)
              WIDTH=1920
              HEIGHT=1080
              ;;

            720p)
              WIDTH=1280
              HEIGHT=720
              ;;

            *)
              echo "Resolução inválida."
              exit 1
              ;;

          esac

          # -----------------------------------------------------
          # UPSCALE
          # -----------------------------------------------------

          # Mantém a proporção original.
          #
          # Exemplo:
          #
          # 640x480 (4:3)
          #
          # vira aproximadamente
          #
          # 1440x1080
          #
          # centralizado em 1920x1080.
          #
          # Não estica rostos ou cenários.

          SCALE_FILTER="scale=${WIDTH}:${HEIGHT}:force_original_aspect_ratio=decrease:flags=lanczos+accurate_rnd+full_chroma_int,pad=${WIDTH}:${HEIGHT}:(ow-iw)/2:(oh-ih)/2:black"

          # -----------------------------------------------------
          # PERFIL
          # -----------------------------------------------------

          case "$PROFILE" in

            fast)

              echo ""
              echo "Perfil FAST selecionado."

              VF="hqdn3d=1.0:1.0:4.0:4.0,${SCALE_FILTER},unsharp=5:5:0.25:5:5:0.0"

              PRESET_H264="veryfast"
              PRESET_H265="veryfast"
              ;;

            quality)

              echo ""
              echo "Perfil QUALITY selecionado."

              VF="hqdn3d=1.5:1.5:6.0:6.0,deband=1thr=0.018:2thr=0.018:3thr=0.018:4thr=0.018:range=16:blur=true,${SCALE_FILTER},unsharp=5:5:0.40:5:5:0.0"

              PRESET_H264="fast"
              PRESET_H265="fast"
              ;;

            *)

              echo "Perfil inválido."
              exit 1
              ;;

          esac

          # -----------------------------------------------------
          # CODEC
          # -----------------------------------------------------

          case "$CODEC" in

            h265)

              VIDEO_CODEC="libx265"
              PRESET="$PRESET_H265"
              ;;

            h264)

              VIDEO_CODEC="libx264"
              PRESET="$PRESET_H264"
              ;;

            *)

              echo "Codec inválido."
              exit 1
              ;;

          esac

          # -----------------------------------------------------
          # INICIAR
          # -----------------------------------------------------

          echo ""
          echo "========================================="
          echo "INICIANDO PROCESSAMENTO"
          echo "========================================="

          echo ""
          echo "Entrada:"
          ls -lh work/input_video

          echo ""
          echo "Saída:"
          echo "$OUTPUT_FILE"

          echo ""
          echo "Filtro:"
          echo "$VF"

          echo ""

          ffmpeg \
            -hide_banner \
            -y \
            -i work/input_video \
            -map 0:v:0 \
            -map 0:a? \
            -map 0:s? \
            -map_metadata 0 \
            -vf "$VF" \
            -c:v "$VIDEO_CODEC" \
            -preset "$PRESET" \
            -crf "$CRF" \
            -pix_fmt yuv420p \
            -c:a copy \
            -c:s copy \
            "$OUTPUT_FILE"

          echo ""
          echo "========================================="
          echo "PROCESSAMENTO CONCLUÍDO"
          echo "========================================="

          ls -lh "$OUTPUT_FILE"

          echo "output_file=$OUTPUT_FILE" >> "$GITHUB_OUTPUT"

      # =========================================================
      # ANALISAR RESULTADO
      # =========================================================

      - name: Verificar vídeo final
        shell: bash
        run: |
          echo ""
          echo "========================================="
          echo "ARQUIVO FINAL"
          echo "========================================="

          ls -lh output/

          echo ""
          echo "========================================="
          echo "INFORMAÇÕES DO VÍDEO"
          echo "========================================="

          ffprobe \
            -hide_banner \
            output/*.mkv \
            || true

          echo ""
          echo "========================================="
          echo "ESPAÇO EM DISCO"
          echo "========================================="

          df -h .

      # =========================================================
      # UPLOAD
      # =========================================================

      - name: Publicar episódio melhorado
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}
          path: output/*.mkv
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
